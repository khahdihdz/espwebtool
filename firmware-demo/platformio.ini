; Firmware demo cho ESP32 Flash Tool.
; Build bằng PlatformIO (không cần Arduino IDE):
;   pio run                      -> biên dịch, sinh .pio/build/esp32dev/firmware.bin
;   pio run -t upload            -> nạp qua USB nếu bạn build trên máy có PC
;   pio run -t buildfs           -> (không dùng ở demo này, không có SPIFFS)
;
; File .bin cần để flash qua ESP32 Flash Tool nằm tại:
;   .pio/build/esp32dev/firmware.bin      -> offset 0x10000
;   .pio/build/esp32dev/bootloader.bin    -> offset 0x1000
;   .pio/build/esp32dev/partitions.bin    -> offset 0x8000

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -D FIRMWARE_VERSION=\"1.0.0\"
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
